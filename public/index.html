<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Purlfect Fit</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header>
      <p class="eyebrow">Classic top-down raglan</p>
      <h1>Purlfect Fit</h1>
      <p>Explorá una propuesta de tallaje y registrá qué ajustarías.</p>
    </header>

    <main>
      <form id="sizing-form" class="panel">
        <section>
          <h2>Talle y medidas</h2>
          <div class="grid">
            <label>Talle <span class="help" tabindex="0" aria-label="Nombre con el que identificás esta prueba. No modifica el cálculo.">?</span><input name="sizeLabel" value="M" required /></label>
            <label>Busto/pecho corporal (cm) <span class="help" tabindex="0" aria-label="Contorno del cuerpo medido sin agregar holgura.">?</span><input name="bust" type="number" step="0.1" value="70" required /></label>
            <label>Bíceps corporal (cm) <span class="help" tabindex="0" aria-label="Contorno de la parte más ancha del brazo, medido sin holgura.">?</span><input name="bicep" type="number" step="0.1" value="26" required /></label>
            <label>Profundidad de sisa (cm) <span class="help" tabindex="0" aria-label="Distancia vertical corporal desde el hombro hasta el nivel de la axila.">?</span><input name="armhole" type="number" step="0.1" value="15" required /></label>
          </div>
        </section>

        <section>
          <h2>Holgura y tolerancia</h2>
          <div class="grid">
            <label>Holgura de cuerpo (cm) <span class="help" tabindex="0" aria-label="Centímetros que se suman al contorno corporal para obtener el contorno terminado del sweater. Puede ser negativa.">?</span><input name="bustEase" type="number" step="0.1" value="6" required /></label>
            <label>Holgura de bíceps (cm) <span class="help" tabindex="0" aria-label="Centímetros que se suman al bíceps corporal para obtener el contorno terminado de manga. Puede ser negativa.">?</span><input name="bicepEase" type="number" step="0.1" value="2" required /></label>
            <label>Holgura de sisa (cm) <span class="help" tabindex="0" aria-label="Centímetros que se suman a la profundidad de sisa corporal para definir la profundidad objetivo del canesú.">?</span><input name="armholeEase" type="number" step="0.1" value="1" required /></label>
            <label>Tolerancia (cm) <span class="help" tabindex="0" aria-label="Desvío máximo aceptado entre la medida objetivo y la propuesta, aplicado por separado a cuerpo, manga y canesú.">?</span><input name="tolerance" type="number" min="0" step="0.1" value="0.5" required /></label>
          </div>
        </section>

        <section>
          <h2>Muestra y construcción</h2>
          <div class="grid">
            <label>Puntos / 10 cm <span class="help" tabindex="0" aria-label="Cantidad de puntos que mide 10 cm en la muestra lavada y bloqueada.">?</span><input name="stitchGauge" type="number" min="1" value="20" required /></label>
            <label>Vueltas / 10 cm <span class="help" tabindex="0" aria-label="Cantidad de vueltas que mide 10 cm en la muestra lavada y bloqueada.">?</span><input name="rowGauge" type="number" min="1" value="25" required /></label>
            <label>Puntos de montaje <span class="help" tabindex="0" aria-label="Cantidad total de puntos con la que comienza el canesú antes de realizar aumentos.">?</span><input name="castOn" type="number" min="1" value="80" required /></label>
            <label>Puntos iniciales por manga <span class="help" tabindex="0" aria-label="Puntos asignados a cada manga al comenzar el canesú, antes de los aumentos de raglán.">?</span><input name="initialSleeve" type="number" min="1" value="10" required /></label>
            <label>Aumentar cada N vueltas <span class="help" tabindex="0" aria-label="Frecuencia de los aumentos conjuntos de raglán. Por ejemplo, 2 significa aumentar una vez cada dos vueltas.">?</span><input name="increaseEvery" type="number" min="1" value="2" required /></label>
            <label>Bajo axila mínimo <span class="help" tabindex="0" aria-label="Menor cantidad de puntos que permitís montar bajo cada axila al separar cuerpo y mangas. El solver probará desde este valor.">?</span><input name="underarmMin" type="number" min="0" value="0" required /></label>
            <label>Bajo axila máximo <span class="help" tabindex="0" aria-label="Mayor cantidad de puntos que permitís montar bajo cada axila. El solver no propondrá un valor superior.">?</span><input name="underarmMax" type="number" min="0" value="10" required /></label>
          </div>
        </section>

        <button type="submit">Calcular propuesta</button>
        <p id="form-error" class="error" role="alert"></p>
      </form>

      <section id="result" class="panel" hidden aria-live="polite"></section>

      <form id="feedback-form" class="panel" hidden>
        <h2>Feedback de esta prueba</h2>
        <label>Evaluación
          <select name="status" required>
            <option value="">Seleccionar…</option>
            <option value="accepted">La usaría</option>
            <option value="needs-adjustment">Necesita ajustes</option>
            <option value="rejected">No sirve</option>
          </select>
        </label>
        <fieldset>
          <legend>¿Qué revisarías?</legend>
          <div class="checks">
            <label><input type="checkbox" name="focus" value="body" /> Cuerpo</label>
            <label><input type="checkbox" name="focus" value="sleeve" /> Manga</label>
            <label><input type="checkbox" name="focus" value="yoke" /> Canesú</label>
            <label><input type="checkbox" name="focus" value="underarm" /> Bajo axila</label>
            <label><input type="checkbox" name="focus" value="increases" /> Aumentos</label>
          </div>
        </fieldset>
        <label>Comentario <textarea name="comment" rows="4" placeholder="¿Qué cambiarías y por qué?"></textarea></label>
        <button type="submit">Guardar feedback</button>
        <p id="feedback-message" role="status"></p>
      </form>
    </main>
    <script src="/app.js" type="module"></script>
  </body>
</html>
